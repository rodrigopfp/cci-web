# Verificación automática en GitHub.
#
# Cada vez que alguien sube un cambio o abre una propuesta de cambio (pull
# request), GitHub compila el sitio. Si algo quedó roto —una coma de más, una
# categoría mal escrita— aparece marcado en rojo ANTES de que llegue a producción.
#
# Es la red de seguridad que permite que varias personas editen sin miedo.

name: Verificar que el sitio compila

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v5: el runtime de la propia action ya no depende de Node 20 (evita el
      # aviso de deprecación). node-version abajo sigue en 20 para compilar con
      # la misma versión que produccion (Dockerfile node:20-alpine).
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el sitio
        # El build consulta a Sanity y necesita el projectId/dataset. Se toman
        # de los secretos del repositorio (Settings → Secrets → Actions).
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
        run: npm run build

      - name: Revisar vulnerabilidades conocidas
        run: npm audit --audit-level=high
        continue-on-error: true
